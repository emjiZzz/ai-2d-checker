services:
  - type: web
    name: ai-2d-checker-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Important: MongoDB Atlas Network Access must allow 0.0.0.0/0 since Render free tier has dynamic outbound IPs
      - key: MONGO_URI
        sync: false
      - key: MONGO_FALLBACK_URI
        sync: false
      - key: API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ENGINEER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: ai-2d-checker-backend.onrender.com
      - key: CORS_ORIGINS
        value: ""
      - key: ENABLE_LLM_SUMMARY
        value: "false"
      - key: ENABLE_DB_AUTO_SYNC
        value: "false"
      - key: STORAGE_ROOT
        value: /app/storage
      - key: MAX_FILE_SIZE_MB
        value: "500"
