services:
  - type: web
    name: ai-2d-checker-backend
    runtime: docker
    plan: free
    healthCheckPath: /health

    # `branch` is still pinned and cannot be dropped yet. Without it Render tracks the repo's
    # DEFAULT branch (`main`), which carries neither the Dockerfile nor this file -- verified
    # 2026-09-04 -- so the blueprint would build a commit with no container in it. It comes out
    # when this work merges, not before.
    branch: 3D

    # Off, because on it bypassed the gate this deployment is supposed to have. Render deployed
    # straight off every push to `3D`, in parallel with `.github/workflows/deploy-backend.yml` and
    # without waiting for it, which left that workflow's `needs: [test, build-docker]` -- the
    # quality boundary ADR-013 describes -- in the path of nothing.
    #
    # It also made the free tier's ephemeral disk expensive. `/app/storage` resets on every
    # deploy, so a push discarded whatever drawings the engineers had uploaded; the markings
    # survive in Atlas but the source files do not, and `/reextract` then answers 422 forever.
    # Deploying on a push meant doing that on someone else's editing schedule.
    #
    # While this stays on `3D` the workflow cannot deploy either -- it fires on `main` -- so
    # deploys are manual from the Render dashboard until the merge. That is the intended state:
    # deliberate, and rare enough that losing the uploads is a decision rather than a side effect.
    autoDeploy: false
    envVars:
      # Important: MongoDB Atlas Network Access must allow 0.0.0.0/0 since Render free tier has dynamic outbound IPs
      - key: MONGO_URI
        sync: false
      - key: MONGO_FALLBACK_URI
        sync: false
      - key: API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ENGINEER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: ai-2d-checker-backend.onrender.com
      - key: CORS_ORIGINS
        value: ""
      - key: ENABLE_LLM_SUMMARY
        value: "false"
      - key: ENABLE_DB_AUTO_SYNC
        value: "false"
      - key: STORAGE_ROOT
        value: /app/storage
      - key: MAX_FILE_SIZE_MB
        value: "500"
