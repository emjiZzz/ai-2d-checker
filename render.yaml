services:
  - type: web
    name: ai-2d-checker-backend
    runtime: docker
    plan: free
    healthCheckPath: /health

    # ⚠ TEMPORARY, and both lines have to move together before this merges.
    #
    # Without a `branch` key Render tracks the repo's DEFAULT branch (`main`), which does not
    # carry the Dockerfile or this file yet -- so the blueprint would build a commit with no
    # container in it. Pinned to `3D` so the deployment can be brought up and debugged on the
    # branch that actually has the work.
    #
    # `autoDeploy: true` is deliberate for the same window: while one person is iterating on
    # getting the container to boot, waiting on pytest plus a full image build for every push is
    # the wrong loop, and nobody else is pushing.
    #
    # 🔴 BEFORE MERGING TO `main`: drop `branch`, and set `autoDeploy: false`. Otherwise Render
    # deploys straight off the push, in parallel with `.github/workflows/deploy-backend.yml` and
    # without waiting for it -- which leaves the workflow's `needs: [test, build-docker]` gate
    # documented in ADR-013 but not actually in the path of anything.
    branch: 3D
    autoDeploy: true
    envVars:
      # Important: MongoDB Atlas Network Access must allow 0.0.0.0/0 since Render free tier has dynamic outbound IPs
      - key: MONGO_URI
        sync: false
      - key: MONGO_FALLBACK_URI
        sync: false
      - key: API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ENGINEER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: ai-2d-checker-backend.onrender.com
      - key: CORS_ORIGINS
        value: ""
      - key: ENABLE_LLM_SUMMARY
        value: "false"
      - key: ENABLE_DB_AUTO_SYNC
        value: "false"
      - key: STORAGE_ROOT
        value: /app/storage
      - key: MAX_FILE_SIZE_MB
        value: "500"
