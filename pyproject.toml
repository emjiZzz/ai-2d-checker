[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
# No `-q` here on purpose. It used to be, and because `addopts` is *prepended* to the command
# line, the documented verification command `pytest tests/ -q` resolved to `-qq` — which
# suppresses the final "N passed / N failed" totals line entirely. The one command the docs told
# people to run was the one command that could not report a result, and the 2026-08-11 audit
# package's test numbers were wrong in exactly the way that predicts.
# Callers who want quiet output pass `-q` themselves and still get a total.
addopts = "-ra --tb=short"
testpaths = [
    "tests"
]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
