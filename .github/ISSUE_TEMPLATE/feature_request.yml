name: ✨ Feature Request
description: Propose a new feature or improvement
title: "[FEAT]: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        We are happy to review community suggestions! Please describe your feature request below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, diagrams, or mockups of the feature.
