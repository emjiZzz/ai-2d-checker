name: 🐛 Bug Report
description: Report a bug or issue in the application
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form as completely as possible to help us debug and resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Go to 'Compare Drawings'
        3. Upload file A and file B
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Paste any relevant logs from `storage/logs/` or browser console output.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: App Version, OS, Node Version, Python Version, etc.
      placeholder: Windows 11 Pro, Node v20.12.0, App v1.0.0-alpha
    validations:
      required: true
