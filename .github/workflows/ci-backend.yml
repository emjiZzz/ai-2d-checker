name: CI Python Backend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Development Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/backend/requirements.txt

      # NOTE: lint/format/typing have never actually run in CI before (the old config
      # pointed at a nonexistent services/ai-auditor path). There's substantial existing
      # debt — ~1500 ruff findings, ~120 unformatted files, and mypy can't even complete a
      # pass yet (duplicate module name across infrastructure/rendering/diagnostics.py and
      # infrastructure/audit/diagnostics.py — needs --explicit-package-bases or package
      # __init__.py files). Surfacing these as non-blocking for now rather than silently
      # skipping them or gating on a mass reformat that wasn't asked for. Tests are the
      # hard gate: they exercise actual behavior and already caught real regressions.
      - name: Ruff Code Quality Checks
        run: ruff check services/backend/
        continue-on-error: true

      - name: Ruff Formatting Check
        run: ruff format --check services/backend/
        continue-on-error: true

      - name: Mypy Strict Typing Check
        run: mypy services/backend/
        continue-on-error: true

      - name: Pytest Unit Tests & Coverage
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: ai_2d_checker_ci
          GEMINI_API_KEY: ci-placeholder-key
        run: |
          # Create fake storage directories so path_resolver-backed tests can write
          mkdir -p storage/logs storage/cache storage/secure storage/uploads storage/renderings
          pytest --cov=services/backend
