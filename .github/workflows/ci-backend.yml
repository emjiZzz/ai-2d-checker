name: CI Python Sidecar

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/ai-auditor/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/ai-auditor/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Development Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # If requirements.txt exists in services/ai-auditor, install it:
          if [ -f services/ai-auditor/requirements.txt ]; then
            pip install -r services/ai-auditor/requirements.txt
          fi

      - name: Ruff Code Quality Checks
        run: ruff check services/ai-auditor/

      - name: Ruff Formatting Check
        run: ruff format --check services/ai-auditor/

      - name: Mypy Strict Typing Check
        run: mypy services/ai-auditor/

      - name: Pytest Unit Tests & Coverage
        run: |
          # Create fake storage directory mock so tests resolve paths
          mkdir -p storage/logs
          pytest --cov=services/ai-auditor
