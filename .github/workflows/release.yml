name: Release & Package App

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      # Same dead services/ai-auditor/ path as the dependency audit had, but the consequence here
      # is heavier: with the guard false, PyInstaller bundled the sidecar with *none* of the
      # backend's runtime dependencies — no fastapi, no ezdxf, no beanie. The guard is removed
      # deliberately so a missing requirements file fails the release instead of shipping a
      # binary that cannot import its own application.
      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r services/backend/requirements.txt

      - name: Compile Python Sidecar Executable
        shell: pwsh
        run: |
          # Bundles FastAPI sidecar into a single binary inside apps/desktop/src-tauri/binaries
          ./tools/scripts/build-sidecar.ps1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Tauri Desktop Package
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create Release Product
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
