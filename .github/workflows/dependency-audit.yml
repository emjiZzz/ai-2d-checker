name: Security Dependency Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays
  workflow_dispatch:

jobs:
  audit-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Audit Node Packages
        run: pnpm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No `if [ -f ... ]` guard. This step previously pointed at services/ai-auditor/, a path
      # that has never existed in this layout, so the guard made the whole Python audit a silent
      # no-op: it passed green every Sunday while scanning nothing. A dependency audit that
      # cannot fail is worse than no audit, because it reports safety. If the requirements file
      # moves again, this must break loudly.
      - name: Audit Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r services/backend/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cargo Audit
        run: cargo install cargo-audit

      - name: Audit Rust Crates
        run: |
          cd apps/desktop/src-tauri
          cargo audit
